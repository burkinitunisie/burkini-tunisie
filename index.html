<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burkini Tunisie</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#faf8f5;
color:#333;
}

header{
background:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:28px;
font-weight:bold;
}

nav a{
text-decoration:none;
color:#333;
margin-left:20px;
font-weight:bold;
}

.hero{
height:70vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:55px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
max-width:700px;
}

.btn{
display:inline-block;
margin-top:25px;
background:black;
color:white;
padding:15px 30px;
text-decoration:none;
border-radius:5px;
}

.products{
padding:60px 20px;
}

.products h2{
text-align:center;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:30px;
margin-top:50px;
}
</style>
</head>

<body>

<header>
<div class="logo">Burkini Tunisie</div>

<nav>
<a href="#">Accueil</a>
<a href="#">Boutique</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="hero">
<h1>Burkini Tunisie</h1>
<p>Toujours Classe et Élégante</p>

<a class="btn" href="https://www.facebook.com/BurkiniTunisie">
Découvrir la collection
</a>
</section>

<section class="products">

<h2>Nos Burkinis</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" alt="">
<h3>Burkini Élégance</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=600" alt="">
<h3>Burkini Tahiti</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=600" alt="">
<h3>Collection Été</h3>
</div>

</div>

</section>

<footer>
© 2026 Burkini Tunisie - Tous droits réservés
</footer>

</body>
</html>
